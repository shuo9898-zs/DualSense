# CARLA 系统配置文件
# 调整这些参数来优化性能和功能

[UI_RECORDING]
# UI录制频率 - 10Hz已足够记录驾驶界面变化
TARGET_FPS = 10

# 图像质量缩放 - 0.2 = 384x216分辨率
QUALITY_SCALE = 0.2

# 图像格式 - JPEG更小更快
IMAGE_FORMAT = "jpg"

[GAZE_TRACKING]
# 眼动追踪频率 - 30Hz高精度
SAMPLING_RATE = 30

# 是否启用眼动追踪
ENABLE_GAZE = True

[PERFORMANCE]
# 是否启用性能监控 (会增加轻微开销)
ENABLE_MONITORING = False

# 性能报告间隔(秒)
REPORT_INTERVAL = 15

[CARLA]
# 目标客户端FPS
TARGET_FPS = 35

# 是否启用异步模式
ASYNC_MODE = True

[DATA]
# 自动保存间隔(秒)
AUTO_SAVE_INTERVAL = 60

# 队列缓冲大小
QUEUE_SIZE = 180