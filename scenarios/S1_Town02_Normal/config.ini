# CARLA system configuration
# Adjust these parameters to tune performance and functionality.

[UI_RECORDING]
# UI recording rate; 10 Hz captures driving UI changes.
TARGET_FPS = 10

# Image scale factor; 0.2 gives 384x216 resolution.
QUALITY_SCALE = 0.2

# Image format; JPEG provides smaller files and faster saving.
IMAGE_FORMAT = "jpg"

[GAZE_TRACKING]
# Eye-tracking rate; 30 Hz high-precision sampling.
SAMPLING_RATE = 30

# Enable eye tracking.
ENABLE_GAZE = True

[PERFORMANCE]
# Enable performance monitoring (adds minor overhead).
ENABLE_MONITORING = False

# Performance-report interval in seconds
REPORT_INTERVAL = 15

[CARLA]
# Target client FPS
TARGET_FPS = 35

# Enable asynchronous mode.
ASYNC_MODE = True

[DATA]
# Automatic saving interval in seconds
AUTO_SAVE_INTERVAL = 60

# Queue buffer size
QUEUE_SIZE = 180
